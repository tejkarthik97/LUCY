<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>LUCY: order food with your voice</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#10231D;--sun:#F4B223;--paper:#FFFDF6;--muted:#33463F;--danger:#9B1C14;--teal:#10231D;--s:1}
*{box-sizing:border-box}
body{margin:0;background:var(--sun);color:var(--ink);font:1.2rem/1.5 "Atkinson Hyperlegible","Noto Sans Devanagari","Noto Sans Telugu","Kohinoor Devanagari","Kohinoor Telugu",system-ui,sans-serif}
[hidden]{display:none!important}
h1,h2,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:3px solid var(--ink);background:var(--paper);border-radius:1.3rem 1.3rem 1.3rem .3rem;min-height:3.8rem;padding:.5rem 1.3rem;font-weight:700}
button:hover,button[aria-pressed=true]{background:var(--ink);color:var(--sun)}
:focus-visible{outline:4px solid var(--paper);box-shadow:0 0 0 7px var(--ink)}
.start{min-height:100dvh;display:grid;place-content:center;justify-items:center;gap:2rem;padding:2rem;text-align:center}
.start h1{font-size:clamp(2.4rem,7vw,4.4rem);line-height:1.05;max-width:14ch;letter-spacing:-.02em}
.start p{max-width:32ch}
.orb{width:min(17rem,66vw);height:min(17rem,66vw);border-radius:50%;background:var(--ink);color:var(--sun);border:0;font-size:2.4rem;box-shadow:0 0 0 1rem rgba(16,35,29,.25),0 0 0 2.2rem rgba(16,35,29,.12)}
.orb:hover{background:var(--ink);color:var(--paper)}
.shell{display:grid;grid-template-columns:13rem 1fr;min-height:100dvh}
nav{background:var(--ink);color:var(--sun);padding:1.4rem 1rem}
.brand{font-size:1.8rem;letter-spacing:.04em}
#rail{list-style:none;margin:1.6rem 0 0;padding:0;display:grid;gap:.35rem}
#rail li{padding:.45rem .8rem;border-radius:.5rem;opacity:.6}
#rail li[data-s=done]{opacity:.85}#rail li[data-s=done]::before{content:"\2713  "}
#rail li[data-s=active]{opacity:1;background:var(--sun);color:var(--ink);font-weight:700}
main{padding:clamp(1.2rem,4vw,3rem);display:grid;gap:1.5rem;align-content:start;max-width:60rem}
main:focus{outline:none}
.top{display:flex;align-items:center;gap:2rem;padding:1.3rem 0 .6rem}
#orb{width:5rem;height:5rem;border-radius:50%;background:var(--ink);position:relative;flex:none}
#orb::before,#orb::after{content:"";position:absolute;inset:-.6rem;border-radius:50%;border:3px solid var(--ink);opacity:.35}
#orb::after{inset:-1.3rem;opacity:.16}
#orb[data-s=listening]::before{animation:ring 1.2s ease-out infinite}
#orb[data-s=speaking]{animation:breathe .8s ease-in-out infinite alternate}
#orb[data-s=thinking]{background:transparent;border:4px dashed var(--ink)}
@keyframes ring{from{transform:scale(.9);opacity:.6}to{transform:scale(1.4);opacity:0}}
@keyframes breathe{to{transform:scale(1.12)}}
@media(prefers-reduced-motion:reduce){#orb,#orb::before{animation:none!important}}
#lamp{font-weight:700;font-size:1.3rem}
#cap{font-size:clamp(1.6rem,3.4vw,2.6rem);line-height:1.2;font-weight:700;letter-spacing:-.01em}
#heard{min-height:1.6rem;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:.8rem}
.opts button{min-height:4.4rem;min-width:11rem;font-size:1.4rem}
.typed{display:flex;gap:.6rem}
.typed input{flex:1;font:inherit;padding:.6rem 1rem;border:3px solid var(--ink);border-radius:.8rem;background:var(--paper);color:var(--ink);min-height:3.8rem}
#snap{min-height:7rem;font-size:1.7rem;background:var(--ink);color:var(--sun)}
h2{font-size:1.3rem}#order{margin:0;padding-left:1.4rem}
#err{padding:.9rem 1.1rem;border:3px solid var(--danger);border-radius:.6rem;color:var(--danger);font-weight:700;background:var(--paper)}
@media(max-width:46rem){.shell{grid-template-columns:1fr}nav{padding:.7rem}#rail{margin:.5rem 0 0;display:flex;overflow-x:auto}#rail li{white-space:nowrap}}
.dishes{display:grid;gap:.7rem}
.dish{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.8rem 1rem;border:3px solid var(--ink);border-radius:1rem 1rem 1rem .3rem;background:var(--paper)}
.dish span{display:block;color:var(--muted);font-size:1rem}
.dish[data-on="1"]{box-shadow:inset .6rem 0 0 var(--ink)}
.dish[data-now="1"]{background:var(--ink);color:var(--sun)}.dish[data-now="1"] span{color:var(--sun)}
.qty{display:flex;align-items:center;gap:.5rem}
.qty button{min-width:3.4rem;min-height:3.4rem;padding:0;font-size:1.6rem}
.qty output{min-width:2rem;text-align:center;font-weight:700;font-size:1.4rem}
#notesbox{display:grid;gap:.6rem}
#notesbox textarea{font:inherit;padding:.7rem 1rem;border:3px solid var(--ink);border-radius:.8rem;background:var(--paper);color:var(--ink);min-height:6rem}
.nb{display:flex;gap:.6rem;flex-wrap:wrap}
#msgbar{display:grid;gap:.6rem;border:3px solid var(--ink);border-radius:1rem 1rem 1rem .3rem;padding:1rem;background:var(--paper)}
.mrow{display:flex;gap:.6rem}
.mrow input{flex:1;font:inherit;padding:.6rem 1rem;border:3px solid var(--ink);border-radius:.8rem;background:var(--paper);color:var(--ink);min-height:3.6rem}
#manswer{font-size:1.25rem;font-weight:700;min-height:1.5rem}
.spd{margin-left:auto;font-size:1rem;display:flex;align-items:center;gap:.5rem}
.spd select{font:inherit;padding:.3rem .5rem;border:3px solid var(--ink);border-radius:.6rem;background:var(--paper);color:var(--ink)}
.lcard{flex:1 1 15rem;display:grid;gap:.8rem;align-content:space-between;padding:1rem;border:3px solid var(--ink);border-radius:1rem 1rem 1rem .3rem;background:var(--paper)}
.lcard p{font-size:1.5rem;font-weight:700;line-height:1.3}
.lcard[data-now="1"]{background:var(--ink);color:var(--sun)}.lcard[data-now="1"] button{background:var(--sun);color:var(--ink)}
.wpanel{border:3px solid var(--ink);background:var(--paper);border-radius:1rem;padding:1rem 1.2rem;display:grid;gap:.4rem}
#wtext{font-size:1.5rem;font-weight:700;line-height:1.3}
#pick{min-height:4.4rem;font-size:1.3rem}
</style>
</head>
<body>
<section id="start" class="start">
  <h1>Order food with your voice</h1>
  <p>Works in English, Hindi and Telugu. Press any key or tap anywhere to begin.</p>
  <button id="startBtn" class="orb" autofocus>Start</button>
</section>

<div id="app" class="shell" hidden>
  <nav aria-label="Progress"><b class="brand">LUCY</b>
    <ol id="rail"><li>Language</li><li>Access</li><li>Menu</li><li>Taste</li><li>Order</li><li>Meal</li><li>Bill</li></ol></nav>
  <main id="main" tabindex="-1">
    <div class="top"><div id="orb" data-s="idle" aria-hidden="true"></div><span id="lamp" data-s="idle" role="status" aria-live="polite"><span id="lt">Getting ready</span></span>
      <label class="spd">Voice speed <select id="rate"><option value="1">Normal</option><option value="1.15">Faster</option><option value="1.3" selected>Fast</option><option value="1.5">Very fast</option></select></label></div>
    <h1 id="cap" aria-live="polite"></h1>
    <p id="heard" aria-live="polite"></p>
    <section id="wpanel" class="wpanel" hidden aria-label="Message for the waiter"><h2>For the waiter (English)</h2><p id="wtext" lang="en"></p></section>
    <div id="opts" class="opts"></div>
    <section id="msgbar" hidden aria-label="Message bar"><label for="mq"><b>Message bar.</b> Ask LUCY anything about these dishes or food.</label>
      <div class="mrow"><input id="mq" type="text" autocomplete="off" placeholder="Type your question and press Enter"><button id="msend">Ask</button></div>
      <p id="manswer" aria-live="polite"></p></section>
    <div id="dishes" class="dishes"></div>
    <div id="typedbox" class="typed" hidden><input id="ti" type="text" aria-label="Type your answer" placeholder="Type here and press Enter"><button id="tsend">Send</button></div>
    <div id="notesbox" hidden><label for="notes"><b>Special cooking instructions</b> (type here, or just speak)</label>
      <textarea id="notes" placeholder="For example: less oil, no onion, extra crispy"></textarea>
      <div class="nb"><button id="notesSave">Save instructions</button><button id="notesNone">No special instructions</button></div></div>
    <button id="snap" hidden>Take a photo. Tap here or press any key.</button>
    <button id="pick" hidden>Upload a photo from the gallery</button>
    <input id="file2" type="file" accept="image/*" hidden>
    <input id="file" type="file" accept="image/*" capture="environment" hidden>
    <section><h2>Your order</h2><ul id="order"></ul></section>
    <p id="err" role="alert" hidden></p>
  </main>
</div>

<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s), sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const S = { lang: 'en', mute: false, noMic: false, rate: 1.3, hold: 700, wait: 6000, order: [], sent: {} };
let tok = 0, started = false;
const until = async (f) => { while (!f()) await sleep(100); };

// ---------- server ----------
async function api(path, o) {
  const fd = new FormData(); for (const k in o) fd.append(k, o[k]);
  let r; try { r = await fetch(path, { method: 'POST', body: fd }); } catch (e) { throw new Error('network'); }
  if (!r.ok) {                                  // keep the server's reason so the screen can show it
    let d = ''; try { d = (await r.json()).error || ''; } catch (e) {}
    const e = new Error('service'); e.status = r.status; e.detail = d; throw e;
  }
  return r;
}
const json = async (p, o) => (await api(p, o)).json();
const err = (t) => { const e = $('#err'); e.textContent = t; e.hidden = !t; };
const cap = (t) => { $('#cap').textContent = t; };
const wshow = (t) => { $('#wpanel').hidden = !t; $('#wtext').textContent = t || ''; };
const failMsg = (e) => e && e.status === 413 ? 'The photo is too large.' : e && e.status === 429 ? 'Too many requests. Please wait a moment.'
  : e && e.message === 'network' ? 'Cannot reach the server.' : (e && e.detail) || 'The reading service did not respond.';
async function shrink(file, max = 2000) {       // phone photos are huge: smaller uploads are faster and always accepted
  try {
    const bmp = await createImageBitmap(file), k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    if (k === 1 && file.size < 3e6) return file;
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.85));
    return blob && blob.size < file.size ? new File([blob], 'photo.jpg', { type: 'image/jpeg' }) : file;
  } catch (e) { return file; }
}
const stage = (k) => document.querySelectorAll('#rail li').forEach((li, i) => { li.dataset.s = i < k ? 'done' : i === k ? 'active' : ''; });
const lamp = (s, t) => { $('#orb').dataset.s = s; $('#lamp').dataset.s = s; $('#lt').textContent = t; };

// ---------- speech out ----------
const tc = new Map(), sc = new Map();
async function tr(t) {
  if (S.lang === 'en' || !t) return t;
  const k = S.lang + t; if (tc.has(k)) return tc.get(k);
  const o = (await json('/api/translate', { text: t, src: 'en', tgt: S.lang })).text; tc.set(k, o); return o;
}
async function speech(t, l) {
  const k = l + t; if (sc.has(k)) return sc.get(k);
  const b = await (await api('/api/tts', { text: t, lang: l })).blob(); sc.set(k, b); return b;
}
let audio = null, endAudio = null;
function stopAudio() { const e = endAudio; endAudio = null; if (audio) { audio.pause(); audio = null; } if (e) e(); }
function play(blob) {
  return new Promise((res) => {
    stopAudio();
    const u = URL.createObjectURL(blob), a = new Audio(u);
    const done = () => { URL.revokeObjectURL(u); if (audio === a) audio = null; endAudio = null; res(); };
    a.playbackRate = S.rate; a.onended = a.onerror = done; audio = a; endAudio = done; a.play().catch(done);
  });
}
async function prepare(en) {
  let t = en, l = 'en', b = null;
  if (S.lang !== 'en') { try { t = await tr(en); l = S.lang; } catch (e) {} }
  if (!S.mute) { try { b = await speech(t, l); } catch (e) {} }
  return { t, b };
}
async function say(en) {                       // English in, user's language out
  let t = en, l = 'en';
  if (S.lang !== 'en') { try { t = await tr(en); l = S.lang; } catch (e) {} }
  cap(t); lamp('speaking', 'LUCY is speaking');
  if (S.mute) { await sleep(Math.min(7000, 1200 + t.length * 45)); return; }   // captions stay readable
  try { await play(await speech(t, l)); } catch (e) {}
}

// ---------- listening: records, stops by itself when you stop talking ----------
function wav(samples, rate) {
  const b = new ArrayBuffer(44 + samples.length * 2), v = new DataView(b);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, samples.length * 2, true);
  for (let i = 0; i < samples.length; i++) { const s = Math.max(-1, Math.min(1, samples[i])); v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true); }
  return new Blob([b], { type: 'audio/wav' });
}
async function toWav(blob) {
  const c = new (window.AudioContext || window.webkitAudioContext)();
  const a = await c.decodeAudioData(await blob.arrayBuffer()); c.close();
  const o = new OfflineAudioContext(1, Math.max(1, Math.ceil(a.duration * 16000)), 16000), s = o.createBufferSource();
  s.buffer = a; s.connect(o.destination); s.start();
  return wav((await o.startRendering()).getChannelData(0), 16000);
}
async function listenAuto({ lang, cancelled = () => false, noSpeechMs = 6000, silenceMs = 1300, maxMs = 15000 }) {
  let st; try { st = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { throw new Error('mic'); }
  const ctx = new (window.AudioContext || window.webkitAudioContext)(), an = ctx.createAnalyser(); an.fftSize = 1024;
  ctx.createMediaStreamSource(st).connect(an);
  const buf = new Float32Array(an.fftSize), rec = new MediaRecorder(st), parts = [];
  rec.ondataavailable = (e) => { if (e.data.size) parts.push(e.data); };
  const stopped = new Promise((r) => { rec.onstop = r; }); rec.start();
  const t0 = performance.now(); let heard = false, last = t0, fs = 0, fn = 0;
  await new Promise((resolve) => {
    const tick = () => {
      an.getFloatTimeDomainData(buf); let sum = 0; for (let k = 0; k < buf.length; k++) sum += buf[k] * buf[k];
      const rms = Math.sqrt(sum / buf.length), now = performance.now();
      if (now - t0 < 350) { fs += rms; fn++; } else if (rms > Math.max(0.02, (fs / Math.max(1, fn)) * 3)) { heard = true; last = now; }
      if (cancelled() || now - t0 > maxMs) return resolve();
      if (heard && now - last > silenceMs) return resolve();
      if (!heard && now - t0 > noSpeechMs) return resolve();
      setTimeout(tick, 80);
    };
    tick();
  });
  rec.stop(); await stopped; st.getTracks().forEach((t) => t.stop()); ctx.close();
  if (cancelled() || !heard) return null;
  const fd = await toWav(new Blob(parts, { type: rec.mimeType }));
  return ((await json('/api/asr', { audio: fd, lang })).text || '').trim();
}
const listen = (c) => listenAuto({ lang: S.lang, cancelled: c, noSpeechMs: S.wait, silenceMs: S.hold });
const ALIAS = { yes: ['yes','yeah','yep','ok','okay','sure','correct','right','haan','han','हाँ','हां','అవును'], no: ['no','nope','change','nahi','नहीं','కాదు'], veg: ['vegetarian'], non_veg: ['nonveg','nonvegetarian'] };
const NEG = ['not','no','non','dont','don','never','without'];
const NONE_NATIVE = /(नहीं|नही|లేదు|కాదు|nahi)/i;
function quick(text, opts) {                   // clear one-word answers are matched here, with no server call
  const tk = tokens(text); if (!tk.length || tk.length > 5) return [];
  const hits = opts.filter((o) => { const w = tokens(o.label).filter((x) => x.length >= 2); return (w.length && w.every((x) => tk.includes(x))) || tk.some((x) => (ALIAS[o.id] || []).includes(x)); });
  if (!hits.length) return [];
  const len = (o) => tokens(o.label).length; hits.sort((a, b) => len(b) - len(a));
  if (hits.length > 1 && len(hits[0]) === len(hits[1])) return [];
  const best = hits[0];
  if (best.id !== 'no' && tk.some((x) => NEG.includes(x) && !tokens(best.label).includes(x))) return [];
  return [best.id];
}
const toEn = async (t) => { if (S.lang === 'en') return t; try { return (await json('/api/translate', { text: t, src: S.lang, tgt: 'en' })).text; } catch (e) { return t; } };
function typed(raw) {
  return new Promise((r) => {
    const w = $('#typedbox'), i = $('#ti'); w.hidden = false; i.value = ''; i.focus();
    const go = async () => { const v = i.value.trim(); if (!v) return; w.hidden = true; r(raw ? v : await toEn(v)); };
    $('#tsend').onclick = go; i.onkeydown = (e) => { if (e.key === 'Enter') go(); };
  });
}
async function hear(c = () => false) {         // free speech, returned in English
  S.raw = ''; if (S.noMic) return typed();
  lamp('listening', 'Listening'); const h = await listen(c);
  if (!h) return ''; S.raw = h; $('#heard').textContent = 'I heard: ' + h; lamp('thinking', 'Thinking'); return toEn(h);
}

// ---------- language step ----------
const tokens = (t) => ((t || '').normalize('NFC').toLowerCase().match(/[\p{L}\p{M}\p{N}]+/gu)) || [];
const YES = ['yes','yeah','yep','yup','ok','okay','sure','haan','han','haa','ha','haanji','ji','हाँ','हां','हा','हाँजी','जी','ठीक','सही','అవును','ఔను','అవునండి','సరే','avunu','avnu','aunu'];
const NONE_RE = /^\W*(no|none|nope|nothing|neither|nahi|nahin)(\W+(of them|of these|of the above|thanks|thank you|please|allergies|allergy|i do not|i don't|for me))*\W*$/i;
const LW = { en: ['english','इंग्लिश','अंग्रेजी','अंग्रेज़ी','ఇంగ్లీష్','ఇంగ్లీషు','ఆంగ్లం'], hi: ['hindi','हिंदी','हिन्दी','హిందీ'], te: ['telugu','तेलुगु','तेलुगू','తెలుగు','తెలుగులో'] };
const LQ = {   // [spoken question, displayed question, yes]
  en: ['Are you comfortable in the language I am speaking?', 'Are you comfortable in the language that is being displayed?', 'Yes'],
  hi: ['क्या आप उस भाषा में सहज हैं जिसमें मैं बोल रही हूँ?', 'क्या आप उस भाषा में सहज हैं जो स्क्रीन पर दिखाई जा रही है?', 'हाँ'],
  te: ['నేను మాట్లాడుతున్న భాషలో మీరు సౌకర్యంగా ఉన్నారా?', 'తెరపై చూపిస్తున్న భాషలో మీరు సౌకర్యంగా ఉన్నారా?', 'అవును']
};
const OKL = { en: 'Great. We will continue in English.', hi: 'ठीक है, हम हिंदी में बात करेंगे।', te: 'సరే, మనం తెలుగులో మాట్లాడదాం.' };
const THANKS = { en: 'Thank you for choosing me to assist you in your endeavour.', hi: 'आपकी सहायता करने के लिए मुझे चुनने के लिए धन्यवाद।', te: 'మీకు సహాయం చేయడానికి నన్ను ఎంచుకున్నందుకు ధన్యవాదాలు.' };
async function chooseLanguage() {
  const id = ++tok, ok = () => id === tok; let pick = null, micOk = true;
  const box = $('#opts'); box.textContent = ''; cap('LUCY'); const cards = {};
  ['en', 'hi', 'te'].forEach((l) => {
    const c = document.createElement('div'); c.className = 'lcard'; c.lang = l;
    const p = document.createElement('p'), b = document.createElement('button');
    p.textContent = LQ[l][1]; b.textContent = LQ[l][2]; b.onclick = () => { pick = l; stopAudio(); };
    c.append(p, b); box.append(c); cards[l] = c;
  });
  try { (await navigator.mediaDevices.getUserMedia({ audio: true })).getTracks().forEach((t) => t.stop()); }
  catch (e) { micOk = false; err('The microphone is blocked. Allow it in the browser, or tap Yes on a language.'); }
  outer: for (let round = 0; round < 3 && micOk; round++) {
    for (const l of ['en', 'hi', 'te']) {
      if (pick || !ok()) break outer;
      Object.values(cards).forEach((c) => { c.dataset.now = ''; }); cards[l].dataset.now = '1';
      lamp('speaking', 'LUCY is speaking');
      try { await play(await speech(LQ[l][0], l)); } catch (e) {}
      if (pick) break outer;
      lamp('listening', 'Listening. Say yes, or tap Yes.');
      let h = null; try { h = await listenAuto({ lang: l, cancelled: () => pick || !ok() }); } catch (e) { if (e.message === 'mic') break outer; continue; }
      if (pick || !h) continue;

  const allergyRaw = await askSure('Do you have any allergies?', [
    ...Object.keys(ALLERGY).map((k) => ({ id: k, label: ALLERGY[k] })), { id: 'none', label: 'No allergies' }], true);
  const allergies = allergyRaw.filter((a) => a !== 'none');
  if (!allergyRaw.length) await say('I did not get an answer about allergies, so I will assume none. Please tell the waiter if you have any.');
  const vn = (await askSure('Veg or non veg?', [{ id: 'veg', label: 'Veg' }, { id: 'non_veg', label: 'Non veg' }], false))[0];
  let diet = vn || 'veg';
  if (!vn) await say('I did not get an answer, so I will show only vegetarian dishes.');
  if (diet === 'veg') diet = (await askSure('Jain or normal veg?', [{ id: 'jain', label: 'Jain' }, { id: 'veg', label: 'Normal veg' }], false))[0] || 'veg';
  const allowed = (d) => !(diet !== 'non_veg' && d.diet === 'non_veg') && !(diet === 'veg' && d.diet === 'egg') &&
    !(diet === 'non_veg' && d.diet === 'veg' && (d.course === 'starter' || d.course === 'main')) &&
    !(diet === 'jain' && (d.jain_possible === false || d.diet === 'egg')) && !d.allergens.some((a) => allergies.includes(a)) &&
    !(allergies.length && d.confidence === 'low');   // not sure what is in it: do not offer it to an allergic diner
  const dishes = menu.filter(allowed); S.prefs = { diet, allergies };
  const courses = Object.keys(COURSE).filter((c) => dishes.some((d) => d.course === c));
  if (!courses.length) { await say('Sorry, I could not find dishes that match. Please ask the waiter for help.'); return; }
  const picked = await ask('What types of courses do you want to order?', courses.map((c) => ({ id: c, label: COURSE[c] })), true);
  if (allergies.length) await say('I read this menu from a photo, so I have left out dishes I am not sure about. Please confirm your allergies with the waiter before eating.');

  stage(4);
  const chosen = picked.length ? picked : courses, pool = dishes.filter((d) => chosen.includes(d.course));
  const browse = async () => { for (const c of chosen) { if ((await orderFrom(pool.filter((d) => d.course === c), COURSE[c], pool)) === 'done') break; } };
  let spice = 'medium', notes = '', confirmed = false;
  const details = async () => {
    spice = (await ask('What level of spice would you like the items to be?', [{ id: 'mild', label: 'Mild' }, { id: 'medium', label: 'Medium' }, { id: 'hot', label: 'Hot' }, { id: 'extra_hot', label: 'Extra hot' }], false))[0] || 'medium';
    notes = '';
    await say('Do you want to add any specific cooking instructions for the chef? Type them in the box, or say them. If not, tap No special instructions.');
    for (let n = 0; n < 3; n++) {
      notes = await getNotes();
      if (/^\W*(none|no|nothing)\W*$/i.test(notes)) { notes = ''; break; }
      if (!notes) break;
      if ((notes.match(/\p{L}/gu) || []).length < 3) { await say('I did not catch that. Please say or type your instructions again.'); notes = ''; continue; }
      if (!S.noteVoice) break;                 // typed text needs no read-back
      const yn = await ask('I heard: ' + notes + '. Is that right?', [{ id: 'yes', label: 'Yes' }, { id: 'no', label: 'No' }], false);
      if (yn[0] !== 'no') break;
      await say('Okay. Please say or type your instructions again.'); notes = '';
    }
  };
  const totalNow = () => S.order.reduce((s, o) => s + (o.price || 0) * o.qty, 0);
  await browse();
  while (S.order.length && !confirmed) {
    await details();
    await say('Your order is ' + S.order.map((o) => o.qty + ' ' + o.name).join(', ') + '. Spice: ' + spice.replace('_', ' ') + '.' + (notes ? ' Instructions: ' + notes + '.' : '') + ' About ' + totalNow() + ' rupees before tax.');
    const yn = await askSure('Is this order correct?', [{ id: 'yes', label: 'Yes' }, { id: 'no', label: 'No, I want to change it' }], false);
    if (yn[0] === 'no') { await say('Okay, let us change your order.'); await browse(); } else confirmed = true;
  }
  const handOver = async () => {
    const first = !Object.keys(S.sent).length;
    const items = S.order.map((x) => ({ name: x.name, price: x.price, qty: x.qty - (S.sent[x.name] || 0) })).filter((x) => x.qty > 0);
    if (!items.length) { await say('You have not added anything new.'); return; }
    try { await json('/api/orderslip', { order: JSON.stringify(items), spice, notes: first ? notes : '', diet, allergies: allergies.join(',') }); } catch (e) {}
    await callWaiter(items, { spice, notes, diet, allergies, total: totalNow() }, first);
    items.forEach((x) => { S.sent[x.name] = (S.sent[x.name] || 0) + x.qty; });
  };
  if (S.order.length) await handOver(); else await say('You have not ordered anything yet. You can add dishes any time.');

  stage(5);
  await say('If you have any complaints or feedback, or want to add something to your order, just reach out to me and I will let the waiter know. Also, consult me once you have eaten and I shall ask the waiter to bring the bill.');
  for (;;) {
    cap(await tr('Enjoy your meal. Tap a button, or press any key and tell me what you need.').catch(() => 'Enjoy your meal.'));
    const a = await mealMenu();
    if (a === 'done') break;
    if (a === 'add') { await browse(); await handOver(); }
    else if (a === 'feedback') {
      await say('Please tell me your complaint, feedback or message for the waiter.');
      let fb = ''; for (let n = 0; n < 2 && !fb; n++) { try { fb = await hear(); } catch (e) {} if (!fb && n === 0 && !S.noMic) await say('I did not hear you. Please try again.'); }
      if (!fb) { await say('I did not hear a message.'); continue; }
      try { await json('/api/feedback', { text: fb }); } catch (e) {}
      await say('I will tell the waiter. When the waiter is here, press any key or tap the screen.'); await waitKey();
      await waiterLoop('Hello. I am Lucy, an ordering assistant. ' + waiterWho() + ' The customer has this message for you: ' + fb, 'Understood');
    }
  }

  stage(6);
  await say('I will now ask the waiter to bring the bill. When the waiter is here, press any key or tap the screen.'); await waitKey();
  await waiterLoop('Hello. I am Lucy, an ordering assistant. ' + waiterWho() + ' The customer has finished eating and would like the bill. Please bring the bill, then upload a photo of it using the buttons on the screen. Thank you.', 'Understood');
  let bill = null;
  while (!bill) {
    const f = await photo('', 'Take a photo of the bill');
    try { bill = await readPhoto('/api/bill', f, 'Reading the bill.'); }
    catch (e) { console.error('bill failed', e); err(failMsg(e)); await say('I could not read the bill. ' + failMsg(e) + ' The waiter will try the photo again.'); if (e.status === 429) await sleep(5000); }
  }
  err('');
  const calc = bill.items.reduce((s, i) => s + i.amount, 0) + bill.charges.reduce((s, c) => s + c.amount, 0);
  const tot = bill.total != null ? bill.total : calc;
  const g = $('#dishes'); g.textContent = '';
  const row = (a, b) => { const d = document.createElement('div'); d.className = 'dish'; const x = document.createElement('b'), y = document.createElement('b'); x.textContent = a; y.textContent = b; d.append(x, y); g.append(d); };
  bill.items.forEach((i) => row((i.qty > 1 ? i.qty + ' x ' : '') + i.name, 'Rs ' + i.amount)); bill.charges.forEach((c) => row(c.name, 'Rs ' + c.amount)); row('Total', 'Rs ' + tot);
  let s = 'Your bill has ' + bill.items.length + ' items. ' + bill.items.map((i) => (i.qty > 1 ? i.qty + ' times ' : '') + i.name + ', ' + i.amount + ' rupees').join('. ') + '. ';
  if (bill.charges.length) s += 'Extra charges: ' + bill.charges.map((c) => c.name + ', ' + (c.amount < 0 ? 'minus ' + -c.amount : c.amount) + ' rupees').join('. ') + '. ';
  s += 'The total to pay is ' + tot + ' rupees.';
  if (bill.total != null && Math.abs(calc - bill.total) > 2) s += ' The lines I read add up to ' + calc + ' rupees, which is different. Please check the bill with the waiter.';
  await say(s);
  cap(THANKS[S.lang]); lamp('speaking', 'LUCY is speaking');     // spoken out loud for every diner
  try { await play(await speech(THANKS[S.lang], S.lang)); } catch (e) {}
  lamp('idle', 'Done'); $('#heard').textContent = 'Press any key to start again.';
  await waitKey(); location.reload();
}

function begin() {
  if (started) return; started = true;
  $('#start').hidden = true; $('#app').hidden = false; $('#main').focus();
  run().catch(async () => { err('Something went wrong. Press any key to start again.'); lamp('idle', 'Stopped'); await waitKey(); location.reload(); });
}
$('#rate').onchange = (e) => { S.rate = parseFloat(e.target.value) || 1; if (audio) audio.playbackRate = S.rate; };
$('#start').addEventListener('click', begin);
document.addEventListener('keydown', (e) => { if (!$('#start').hidden && !e.metaKey && !e.ctrlKey && !e.altKey && e.key !== 'Tab' && e.key !== 'Shift') { e.preventDefault(); begin(); } });
})();
</script>
</body>
